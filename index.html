<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constelación normativa</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020308;color:#d0e4ff;font-family:'Segoe UI',system-ui,Arial,sans-serif}canvas{position:fixed;inset:0}.box{position:fixed;z-index:5;background:rgba(2,5,18,.9);border:1px solid #122040;border-radius:9px;padding:10px 13px;backdrop-filter:blur(14px)}#stats{left:16px;top:16px}.big{font-size:13px;font-weight:800;color:#dbeafe;margin-bottom:5px}.rings{display:flex;gap:8px;flex-wrap:wrap;font-size:9.5px}.rings b{font-weight:900}#panel{right:16px;top:16px;width:278px}.pn{font-size:13px;font-weight:700;color:#90b8f8;margin-bottom:4px}.pf{font-size:9.5px;color:#3a5878;line-height:1.5}.pl{font-size:8px;color:#426391;text-transform:uppercase;letter-spacing:.7px;margin-top:8px}.pv{font-size:11px;color:#d0e4ff}#legend{left:16px;bottom:16px}.tiny{font-size:8px;color:#426391;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}.leg{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:10px;color:#7a9ccc}.dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 5px currentColor}#center{position:fixed;left:50%;top:50%;transform:translate(-50%,38px);z-index:6;background:#000;color:#ffe000;font-size:9px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;padding:4px 10px;border-radius:3px;border:1px solid rgba(255,224,0,.55);box-shadow:0 0 14px rgba(255,220,0,.35);pointer-events:none}#tip{position:fixed;z-index:8;display:none;pointer-events:none;background:rgba(2,5,18,.96);border:1px solid #1c3a68;border-radius:6px;padding:5px 11px;font-size:10.5px;white-space:nowrap}@media(max-width:900px){#legend{display:none}#panel{width:235px;right:10px;top:10px}#stats{left:10px;top:10px;max-width:calc(100% - 255px)}}</style></head><body><canvas id="cv"></canvas><div id="center">◆ Dirección Escolar ◆</div><div id="tip"></div><div id="stats" class="box"><div class="big">226 normas</div><div class="rings"><span style="color:#ffe000"><b>A1</b> 132</span><span style="color:#ff7a18"><b>A2</b> 67</span><span style="color:#23d3ee"><b>A3</b> 15</span><span style="color:#8b5cf6"><b>A4</b> 12</span></div></div><div id="panel" class="box"><div id="pn" class="pn">Explorador de normas</div><div id="pf" class="pf">Apoyá el mouse sobre una esfera para resaltar conexiones. Clic para fijar.</div></div><div id="legend" class="box"><div class="tiny">Jurisdicción</div><div class="leg"><i class="dot" style="color:#c084fc;background:#c084fc"></i>Internacional</div><div class="leg"><i class="dot" style="color:#3b82f6;background:#3b82f6"></i>Nacional</div><div class="leg"><i class="dot" style="color:#f59e0b;background:#f59e0b"></i>Federal</div><div class="leg"><i class="dot" style="color:#22c55e;background:#22c55e"></i>Provincial</div><div class="tiny" style="margin-top:8px">Anillos</div><div style="font-size:8px;color:#45658f;line-height:1.45"><span style="color:#ffe000">1</span> cercano · <span style="color:#ff7a18">2</span> corresponsable · <span style="color:#23d3ee">3</span> indirecto · <span style="color:#8b5cf6">4</span> fundacional</div></div><script>const cv=document.getElementById('cv'),x=cv.getContext('2d'),C={Internacional:'#c084fc',Nacional:'#3b82f6',Federal:'#f59e0b',Provincial:'#22c55e'},R={1:'#ffe000',2:'#ff7a18',3:'#23d3ee',4:'#8b5cf6'},CNT={1:132,2:67,3:15,4:12},DIR={1:1,2:-1,3:1,4:-1},SPD={1:.000055,2:.000041,3:.000033,4:.000026};let W,H,cx,cy,sel=null,hov=null,tip=document.getElementById('tip'),pn=document.getElementById('pn'),pf=document.getElementById('pf');function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight;cx=W*.5;cy=H*.53}addEventListener('resize',sz);sz();let main=[['Const. Nacional',4,'Nacional',13],['Código Civil y Comercial',4,'Nacional',8],['Ley 26.061 Protección NNyA',3,'Nacional',15],['Ley 26.206 Educación Nacional',4,'Nacional',20],['Const. PBA',4,'Provincial',12],['Ley 13.688 Educación PBA',4,'Provincial',18],['Ley 10.579 Estatuto Docente',1,'Provincial',11],['Ley 10.430 Personal auxiliar',2,'Provincial',7],['Dec. 2299/11 Reglamento Gral.',1,'Provincial',10],['Res. 1650/24 Régimen Académico',1,'Provincial',6],['Res. 1235/23 AIC',1,'Provincial',5],['Res. 1236/23 Trayectorias',1,'Provincial',5],['Ley 26.150 ESI',2,'Nacional',5],['Ley 25.673 Salud Sexual',2,'Nacional',3],['Ley 26.743 Identidad Género',2,'Nacional',4],['Ley 27.621 Educación Ambiental',1,'Nacional',5],['Res. CFE 84/09',2,'Federal',4],['Res. CFE 93/09',2,'Federal',9],['Res. CFE 103/10',2,'Federal',5],['Res. CFE 330/17 MOA',2,'Federal',5],['Ley 23.179 CEDAW',4,'Internacional',3],['Convención DDNN',4,'Internacional',11],['Declaración DDHH',4,'Internacional',2],['Ley 13.298 Derechos Niñez',4,'Provincial',8],['Res. 848/22 Aulas Fortalecimiento',1,'Provincial',4],['Disposición 02/24 Pasantías',1,'Provincial',3],['Salidas educativas',1,'Provincial',3],['Cooperadoras escolares',2,'Provincial',3]],nodes=[],edges=[];main.forEach((d,i)=>nodes.push({id:i,label:d[0],ring:d[1],jur:d[2],cit:d[3],main:1}));function fj(r,i){return r==4?['Nacional','Provincial','Internacional'][i%3]:r==3?['Provincial','Nacional'][i%2]:r==2?['Provincial','Federal','Nacional'][i%3]:i%9?'Provincial':'Nacional'}for(let r=1;r<=4;r++){let h=nodes.filter(n=>n.ring==r).length;for(let i=0;i<CNT[r]-h;i++)nodes.push({id:nodes.length,label:'Norma '+r+'.'+(i+1),ring:r,jur:fj(r,i),cit:i%5?1:2})}let per={1:0,2:0,3:0,4:0};nodes.forEach((n,i)=>{n.idx=per[n.ring]++;n.a=n.idx/CNT[n.ring]*Math.PI*2+Math.sin(i*9)*.04;n.j=Math.sin(i*17)*.035});[[9,5],[9,8],[9,6],[8,5],[8,3],[8,0],[6,5],[6,0],[12,2],[12,13],[12,20],[14,2],[5,3],[5,4],[5,2],[5,6],[5,7],[3,0],[3,2],[3,17],[2,0],[2,1],[17,3],[17,16],[18,9],[18,11],[19,3],[23,2],[24,8],[25,1],[25,8],[26,8]].forEach(p=>edges.push([nodes[p[0]],nodes[p[1]]]));for(let i=0;i<150;i++){let a=nodes[(i*37)%226],b=nodes[(i*71+13)%226];if(a!=b)edges.push([a,b])}let con=new Map(nodes.map(n=>[n.id,new Set()]));edges.forEach(e=>{con.get(e[0].id).add(e[1].id);con.get(e[1].id).add(e[0].id)});function rr(r){let m=Math.min(W*.42,H*.9);return{1:m*.23,2:m*.41,3:m*.61,4:m*.82}[r]}function nr(n){return 3.4+Math.sqrt(n.cit/20)*18}function pos(n,t){let Rr=rr(n.ring),a=n.a+DIR[n.ring]*SPD[n.ring]*t,z=Math.sin(a);return{x:cx+Math.cos(a)*Rr*.78,y:cy+z*Rr*.34,z,a,r:nr(n)*(0.82+(z+1)*.16)}}function drawRing(r){x.save();x.translate(cx,cy);x.beginPath();x.ellipse(0,0,rr(r)*.78,rr(r)*.34,0,0,Math.PI*2);x.strokeStyle=R[r]+'88';x.lineWidth=1.2;x.shadowColor=R[r];x.shadowBlur=8;x.stroke();x.restore()}function round(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}function panel(n){document.querySelectorAll('.pl,.pv').forEach(e=>e.remove());if(!n){pn.textContent='Explorador de normas';pf.textContent='Apoyá el mouse sobre una esfera para resaltar conexiones. Clic para fijar.';return}pn.textContent=n.label;pf.textContent=(n.main?'Norma principal del corpus':'Norma del corpus')+' · anillo '+n.ring;[['Jurisdicción',n.jur],['Citada por',n.cit+' norma'+(n.cit!=1?'s':'')],['Conexiones',con.get(n.id).size]].forEach(a=>{let l=document.createElement('div'),v=document.createElement('div');l.className='pl';v.className='pv';l.textContent=a[0];v.textContent=a[1];if(a[0]=='Jurisdicción')v.style.color=C[n.jur];document.getElementById('panel').append(l,v)})}function loop(t){x.clearRect(0,0,W,H);let g=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);g.addColorStop(0,'#07091a');g.addColorStop(.5,'#04060f');g.addColorStop(1,'#020308');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<800;i++){x.fillStyle=i%4?'#ffffff18':'#4b8dff26';x.fillRect((i*137+t*.006)%W,(i*61+i*i)%H,1,1)}[4,3,2,1].forEach(drawRing);nodes.forEach(n=>Object.assign(n,pos(n,t)));let active=hov||sel;edges.forEach(e=>{let on=active&&(e[0]==active||e[1]==active);x.globalAlpha=active?(on?.78:.025):.09;x.strokeStyle='#fff';x.lineWidth=on?1.5:.45;x.beginPath();x.moveTo(e[0].x,e[0].y);x.quadraticCurveTo((e[0].x+e[1].x)/2,(e[0].y+e[1].y)/2-12,e[1].x,e[1].y);x.stroke()});x.globalAlpha=1;let cg=x.createRadialGradient(cx,cy,0,cx,cy,68);cg.addColorStop(0,'#fff');cg.addColorStop(.5,'#fff');cg.addColorStop(1,'#ffffff00');x.fillStyle=cg;x.beginPath();x.arc(cx,cy,62,0,7);x.fill();x.fillStyle='#050711';x.textAlign='center';x.font='900 18px Segoe UI';x.fillText('Dirección',cx,cy-7);x.fillText('Escolar',cx,cy+15);nodes.slice().sort((a,b)=>a.z-b.z).forEach(n=>{let on=!active||n==active||con.get(active.id).has(n.id);x.globalAlpha=on?1:.18;let c=C[n.jur],gr=x.createRadialGradient(n.x-n.r*.35,n.y-n.r*.35,1,n.x,n.y,n.r*1.4);gr.addColorStop(0,'#fff');gr.addColorStop(.2,c);gr.addColorStop(1,c+'35');x.fillStyle=gr;x.shadowColor=c;x.shadowBlur=n==active?26:10;x.beginPath();x.arc(n.x,n.y,n.r,0,7);x.fill();x.shadowBlur=0});let labs=nodes.filter(n=>n.main&&(n.cit>=8||n==active));labs.forEach(n=>{let dx=n.x-cx,dy=n.y-cy,d=Math.hypot(dx,dy)||1,lx=n.x+dx/d*(70+n.ring*7),ly=n.y+dy/d*(70+n.ring*7),ar=lx<cx,txt=n.label;x.globalAlpha=n==active?1:.82;x.strokeStyle=n==active?'#fff':C[n.jur];x.lineWidth=n==active?1.2:.55;x.beginPath();x.moveTo(n.x,n.y);x.lineTo(lx,ly);x.stroke();x.font=(n==active?'700 11px ':'9px ')+'Segoe UI';let w=x.measureText(txt).width+10,tx=ar?lx-5:lx+5,bx=ar?tx-w+5:tx-5;x.fillStyle='#02040ecc';round(bx,ly-13,w,18,3);x.fill();x.fillStyle=n==active?'#fff':C[n.jur];x.textAlign=ar?'right':'left';x.textBaseline='middle';x.fillText(txt,tx,ly-3)});x.globalAlpha=1;requestAnimationFrame(loop)}cv.onmousemove=e=>{let b=cv.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top,best=null,bd=1e9;nodes.forEach(n=>{let d=Math.hypot(mx-n.x,my-n.y);if(d<n.r+5&&d<bd){best=n;bd=d}});hov=best;cv.style.cursor=hov?'pointer':'default';if(hov){panel(hov);tip.style.display='block';tip.style.left=e.clientX+16+'px';tip.style.top=e.clientY-14+'px';tip.style.color=C[hov.jur];tip.textContent=hov.label+' · '+hov.jur+' · '+hov.cit+' citas'}else{tip.style.display='none';if(!sel)panel(null);else panel(sel)}};cv.onclick=()=>{sel=hov||null;panel(sel)};requestAnimationFrame(loop)</script></body></html>
